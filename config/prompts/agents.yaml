meta:
  domain: "agents"
  owner: "platform-engineering"
  environment: "production"        # production | staging | dev | testing
  schema_version: "1.0"
  governance_model: "centralized"  # centralized | federated
  audit_enabled: true              # true | false
  change_control: true             # true | false
  created: "2026-01-22"
  last_updated: "2026-01-22"

prompts:

  agent_planner:
    id: "agent-planner-v1"
    name: "Agent Planning Prompt"
    version: "1.0.0"
    author: "platform"

    lifecycle:
      state: "active"              # active | testing | deprecated | disabled
      stage: "production"          # production | staging | dev | testing
      approved: true               # true | false
      approved_by: "ai-governance"
      approval_date: "2026-01-22"
      change_ticket: "AI-AGENT-0001"
      rollback_version: "0.9.0"
      change_type: "initial-release" # initial-release | patch | policy-change | rollback
      risk_level: "medium"           # low | medium | high | critical

    compliance:
      pii: false                   # true | false
      gdpr: compliant              # compliant | non-compliant | not-applicable
      hipaa: false                 # true | false
      data_retention: "none"       # none | transient | short-term | long-term
      jurisdiction: "global"       # global | eu | us | apac | custom
      logging_allowed: true        # true | false
      training_allowed: false      # true | false
      audit_required: true         # true | false

    observability:
      tracing: true                # true | false
      metrics: true                # true | false
      logging: true                # true | false
      sampling_rate: 1.0           # 0.0 - 1.0
      trace_level: "standard"      # none | minimal | standard | full
      redact_inputs: false         # true | false
      redact_outputs: false        # true | false
      correlation_id: true         # true | false

    model_policy:
      model: "gpt-5-mini"          # gpt-5-mini | gpt-5 | gpt-4.1 | custom
      temperature: 0.1             # 0.0 - 1.0
      reasoning_effort: "medium"   # low | medium | high
      verbosity: "medium"          # low | medium | high
      deterministic: true          # true | false

    contract:
      input: ["goal", "context", "tools"]
      output: "execution_plan"
      type: "planning"             # planning | reasoning | orchestration

    template: |
      You are an agent planning system in an MCP server.
      Your task is to generate a deterministic execution plan.

      Rules:
      - Break goals into ordered steps
      - Map each step to a tool or capability
      - Do not invent tools
      - Do not invent data
      - Do not skip validation steps
      - Include error-handling steps
      - Include rollback steps
      - Ensure determinism
      - Ensure auditability
      - Ensure traceability
      - Respect lifecycle governance
      - Respect compliance policies
      - Respect routing constraints
      - Output structured steps only
      - No explanations
      - No natural language commentary


  agent_executor:
    id: "agent-executor-v1"
    name: "Agent Execution Prompt"
    version: "1.0.0"
    author: "platform"

    lifecycle:
      state: "active"
      stage: "production"
      approved: true
      approved_by: "ai-governance"
      approval_date: "2026-01-22"
      change_ticket: "AI-AGENT-0002"
      rollback_version: "0.9.0"
      change_type: "initial-release"
      risk_level: "high"            # low | medium | high | critical

    compliance:
      pii: false
      gdpr: compliant
      hipaa: false
      data_retention: "none"
      jurisdiction: "global"
      logging_allowed: true
      training_allowed: false
      audit_required: true

    observability:
      tracing: true
      metrics: true
      logging: true
      sampling_rate: 1.0
      trace_level: "full"
      redact_inputs: true           # true | false
      redact_outputs: true          # true | false
      correlation_id: true

    model_policy:
      model: "gpt-5-mini"
      temperature: 0.0
      reasoning_effort: "high"
      verbosity: "low"
      deterministic: true

    contract:
      input: ["plan", "state", "tools"]
      output: "tool_calls"
      type: "execution"             # execution | orchestration

    template: |
      You are an execution agent in an MCP server.

      Rules:
      - Execute only approved tools
      - Follow the plan strictly
      - Do not invent actions
      - Do not invent tools
      - Validate inputs
      - Validate outputs
      - Enforce governance
      - Enforce lifecycle states
      - Enforce compliance
      - Enforce routing policy
      - Enforce safety policy
      - Produce deterministic tool calls
      - No natural language output
      - No explanations
