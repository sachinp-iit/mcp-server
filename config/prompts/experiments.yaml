meta:
  domain: "experiments"
  owner: "platform-engineering"
  environment: "production"        # production | staging | dev | testing
  schema_version: "1.0"
  governance_model: "centralized"  # centralized | federated
  audit_enabled: true              # true | false
  change_control: true             # true | false
  created: "2026-01-22"
  last_updated: "2026-01-22"

prompts:

  ab_test_router:
    id: "exp-ab-router-v1"
    name: "A/B Test Router"
    version: "1.0.0"
    author: "platform"

    lifecycle:
      state: "testing"             # active | testing | deprecated | disabled
      stage: "staging"             # production | staging | dev | testing
      approved: true               # true | false
      approved_by: "ai-governance"
      approval_date: "2026-01-22"
      change_ticket: "AI-EXP-0001"
      rollback_version: "0.9.0"
      change_type: "experiment"    # initial-release | patch | policy-change | rollback | experiment
      risk_level: "medium"         # low | medium | high | critical

    compliance:
      pii: false                   # true | false
      gdpr: compliant              # compliant | non-compliant | not-applicable
      hipaa: false                 # true | false
      data_retention: "transient"  # none | transient | short-term | long-term
      jurisdiction: "global"       # global | eu | us | apac | custom
      logging_allowed: true        # true | false
      training_allowed: false      # true | false
      audit_required: true         # true | false

    observability:
      tracing: true                # true | false
      metrics: true                # true | false
      logging: true                # true | false
      sampling_rate: 1.0           # 0.0 - 1.0
      trace_level: "full"          # none | minimal | standard | full
      redact_inputs: false         # true | false
      redact_outputs: false        # true | false
      correlation_id: true         # true | false

    model_policy:
      model: "gpt-5-mini"          # gpt-5-mini | gpt-5 | gpt-4.1 | custom
      temperature: 0.3             # 0.0 - 1.0
      reasoning_effort: "medium"   # low | medium | high
      verbosity: "medium"          # low | medium | high
      deterministic: false         # true | false

    contract:
      input: ["user_input", "variants", "context"]
      output: "variant_selection"
      type: "experiment"           # experiment | routing | selection

    template: |
      You are an A/B testing router.

      Rules:
      - Select one variant
      - Use only provided variants
      - Do not invent variants
      - Support controlled randomness
      - Enforce governance
      - Enforce lifecycle
      - Enforce compliance
      - Enforce observability
      - Log selection
      - Output variant id only
      - No explanations
      - No natural language


  prompt_evaluator:
    id: "exp-evaluator-v1"
    name: "Prompt Evaluation Engine"
    version: "1.0.0"
    author: "platform"

    lifecycle:
      state: "testing"
      stage: "staging"
      approved: true
      approved_by: "ai-governance"
      approval_date: "2026-01-22"
      change_ticket: "AI-EXP-0002"
      rollback_version: "0.9.0"
      change_type: "experiment"
      risk_level: "high"            # low | medium | high | critical

    compliance:
      pii: false
      gdpr: compliant
      hipaa: false
      data_retention: "transient"
      jurisdiction: "global"
      logging_allowed: true
      training_allowed: false
      audit_required: true

    observability:
      tracing: true
      metrics: true
      logging: true
      sampling_rate: 1.0
      trace_level: "full"
      redact_inputs: true
      redact_outputs: true
      correlation_id: true

    model_policy:
      model: "gpt-5-mini"
      temperature: 0.4
      reasoning_effort: "high"
      verbosity: "medium"
      deterministic: false

    contract:
      input: ["prompt", "output", "metrics"]
      output: "evaluation_score"
      type: "evaluation"            # evaluation | experiment | analysis

    template: |
      You are a prompt evaluation engine.

      Rules:
      - Evaluate prompt quality
      - Measure output correctness
      - Measure determinism
      - Measure safety
      - Measure compliance
      - Measure hallucination risk
      - Measure consistency
      - Enforce governance
      - Enforce lifecycle
      - Enforce compliance
      - Enforce observability
      - Output structured evaluation result only
      - No explanations
      - No natural language
